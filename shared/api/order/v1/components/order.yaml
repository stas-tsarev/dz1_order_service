type: object
required:
  - order_uuid
  - user_uuid
  - part_uuids
  - total_price
  - transaction_uuid
  - payment_method
  - status
properties:
  order_uuid:
    type: string
    format: uuid
    description: UUID заказа
    example: "8ac8cf24-379e-4a69-89d2-b1ef41fd5711"
  user_uuid:
    type: string
    format: uuid
    description: UUID пользователя
    example: "8ac8cf24-379e-4a69-89d2-b1ef41fd5711"
  part_uuids:
    type: array
    items:
      type: string
      format: uuid
    description: UUID деталей для заказа
    example: [ "7ac1cf89-457e-4a67-19d2-b1ef41fd5326" ]
  total_price:
    type: number
    format: float
    description: Общая стоимость заказа
    example: 123.45
    minimum: 0
  transaction_uuid:
    type: string
    format: uuid
    nullable: true
    description: UUID транзакции (если оплачен)
    example: "8ac8cf24-379e-4a69-89d2-b1ef41fd5711"
  payment_method:
    $ref: ./payment_method.yaml
    nullable: true
    description: Способ оплаты (если оплачен)
    example: "CARD"
  status:
    $ref: ./order_status.yaml
    description: Статус заказа
    example: "PENDING_PAYMENT"